[project]
name = "zimagetrainer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "diffusers>=0.39.0",
    "fastapi>=0.139.0",
    "google-genai>=2.11.0",
    "peft>=0.19.1",
    "pillow>=12.2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.13.0",
    "uvicorn[standard]>=0.51.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
